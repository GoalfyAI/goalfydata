name: Publish Skill Release

# Create a GitHub Release for each skill/v* tag: title = version, body = release notes from skill-release.json.
# register-skill-release.yml updates the server registry; this workflow publishes the public release record.
on:
  push:
    tags:
      - 'skill/v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Create the Release as goalfydata-bot so it is not attributed to a personal account.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4

      - name: Create GitHub Release from skill-release.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#skill/}"
          JSON_VERSION="$(python3 -c "import json; print(json.load(open('skill-release.json'))['version'])")"
          if [ "${VERSION}" != "${JSON_VERSION}" ]; then
            echo "tag ${TAG} does not match skill-release.json version ${JSON_VERSION}" >&2
            exit 1
          fi
          python3 -c "
          import json
          r = json.load(open('skill-release.json'))
          notes = r.get('update_reason') or r.get('notes', '')
          files = ''.join(f'- {f}\n' for f in r.get('files', []))
          print(f'{notes}\n\nReleased at: {r.get(\"updated_at\", \"\")}\n\nFiles:\n{files}')
          " > /tmp/release-notes.md
          gh release create "${TAG}" \
            --title "${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
