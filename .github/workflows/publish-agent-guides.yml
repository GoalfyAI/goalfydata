name: Publish Agent Guides to GoalfyData CDN

on:
  push:
    branches: [main]
    paths:
      - 'claude-code/**'
      - 'codex/**'
      - 'manus/**'
      - 'generic/**'
      - 'scripts/stage-agent-guides.sh'
      - '.github/workflows/publish-agent-guides.yml'
      - '!**/*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      CDN_DISTRIBUTION_ID: ${{ vars.GOALFYDATA_CDN_DISTRIBUTION_ID }}
      CDN_PREFIX: dataset-uds/guides
      S3_BUCKET: goalfyagent-public
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate the canonical guide bundle
        run: |
          staging_root="$(mktemp -d)"
          echo "STAGING_DIR=${staging_root}/guides" >> "$GITHUB_ENV"
          bash scripts/stage-agent-guides.sh "${staging_root}/guides"

      - name: Verify publishing configuration
        run: |
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${CDN_DISTRIBUTION_ID}"

      - name: Publish the dedicated S3 prefix
        run: |
          aws s3 sync \
            "${STAGING_DIR}/" \
            "s3://${S3_BUCKET}/${CDN_PREFIX}/" \
            --delete \
            --cache-control "public,max-age=300"
          aws s3 cp \
            "${STAGING_DIR}/" \
            "s3://${S3_BUCKET}/${CDN_PREFIX}/" \
            --recursive \
            --exclude "*" \
            --include "*.md" \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "public,max-age=300" \
            --metadata-directive REPLACE

      - name: Refresh the GoalfyData CDN
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CDN_DISTRIBUTION_ID}" \
            --paths "/${CDN_PREFIX}/*"
